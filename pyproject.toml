[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sbi-nre"
version = "0.1.0"
description = "A small, readable neural ratio estimation toolkit for simulation-based inference"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["sbi_nre*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
